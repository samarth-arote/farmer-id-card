<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- MODIFIED: Added full responsive viewport settings -->
  <!-- Reason: Ensures proper display scale on mobile phones and tablets without horizontal zooming -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Farmer Card Generator</title>

  <!-- Google Fonts: Inter & Poppins for modern professional typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
  <script src="assets/vendor/html2canvas.min.js"></script>
  <script src="assets/vendor/jspdf.umd.min.js"></script>
  <script src="assets/vendor/qrcode.min.js"></script>
</head>
<body>
  <main class="app">
    <!-- Left Sidebar: Professional Form Panel -->
    <aside class="form-panel">
      <!-- MODIFIED: Modernized Brand Header with Custom Logo Image -->
      <!-- Reason: Incorporates the newly created logo asset and version badge for a professional app identity -->
      <div class="brand">
        <div class="brand-logo-wrapper">
          <img src="assets/logo.png" alt="Farmer ID Logo" class="brand-logo-img">
        </div>
        <div class="brand-info">
          <div class="brand-title-row">
            <h1>Farmer Card Generator</h1>
          </div>
          <p class="subtitle">Fill details, preview card, and export print-ready PDF</p>
        </div>
      </div>

      <form id="cardForm">
        <!-- MODIFIED: Section 1 - Personal Details in a Card Container with SVG Icon -->
        <!-- Reason: Enhances readability and visual hierarchy using structured cards and intuitive iconography -->
        <div class="form-card">
          <div class="card-header">
            <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 4-4H8a4 4 0 0 4-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <h2>Personal Details</h2>
          </div>

          <div class="grid">
            <label>
              <span class="label-text">Marathi Name</span>
              <input name="marathiName" value="" placeholder="उदा. मनोज रामदास शेवाळे">
            </label>
            <label>
              <span class="label-text">English Name</span>
              <input name="englishName" value="" placeholder="e.g. Manoj Ramdas Shewale">
            </label>

            <!-- MODIFIED: Preserved hidden DOB default value "01-01-1973" -->
            <!-- Reason: Keeps original default data structure untouched while improving picker layout -->
            <label>
              <span class="label-text">DOB / जन्म तारीख</span>
              <input
                name="dobDate"
                type="date"
                value=""
                autocomplete="bday"
              >
              <input type="hidden" name="dob" value="01-01-1973">
            </label>

            <label>
              <span class="label-text">Gender / लिंग</span>
              <select name="gender" aria-label="Gender">
                <option value="Male" selected>Male</option>
                <option value="Female">Female</option>
                <option value="Transgender">Transgender</option>
              </select>
            </label>

            <label>
              <span class="label-text">Mobile / मोबाइल</span>
              <input name="mobile" value="" placeholder="9876543210" inputmode="numeric" maxlength="10">
            </label>

            <label>
              <span class="label-text">Aadhaar No / आधार नं</span>
              <input
                name="aadhaar"
                value=""
                placeholder="1234 5678 9012"
                inputmode="numeric"
                autocomplete="off"
                maxlength="14"
              >
            </label>

            <label>
              <span class="label-text">Card Number / आयडी नं</span>
              <input
                name="cardNumber"
                value=""
                placeholder="1234 5678 901"
                inputmode="numeric"
                autocomplete="off"
                maxlength="13"
              >
            </label>

            <label>
              <span class="label-text">Farmer Photo / फोटो</span>
              <div class="file-upload-wrapper">
                <input name="photo" type="file" accept="image/*" id="photoInput" class="file-input">
                <label for="photoInput" class="file-label">
                  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                    <polyline points="17 8 12 3 7 8"></polyline>
                    <line x1="12" y1="3" x2="12" y2="15"></line>
                  </svg>
                  <span id="photoFileName">Choose Photo...</span>
                </label>
              </div>
            </label>
          </div>
        </div>

        <!-- MODIFIED: Section 2 - Address Card Container -->
        <!-- Reason: Preserved default address string while wrapping in modern textarea styling -->
        <div class="form-card">
          <div class="card-header">
            <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
              <circle cx="12" cy="10" r="3"></circle>
            </svg>
            <h2>Address / संपूर्ण पत्ता</h2>
          </div>
          <div class="grid">
            <label class="full">
              <span class="label-text">Complete Address</span>
              <textarea name="address">Bramhanwada tal akole dist ahilyanagar</textarea>
            </label>
          </div>
        </div>

        <!-- MODIFIED: Section 3 - Dynamic Land Details Card Container -->
        <!-- Reason: Keeps dynamic multi-row land entry feature with improved mobile grid & control buttons -->
        <div class="form-card">
          <div class="card-header">
            <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <h2>Land Details / जमिनीची माहिती</h2>
          </div>
          <div id="landRows" class="land-rows-container"></div>

          <button class="btn btn-secondary btn-add-row" type="button" id="addLandRowBtn">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19"></line>
              <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
            Add Land Row
          </button>
        </div>

        <!-- MODIFIED: Form Actions Footer -->
        <!-- Reason: Sticky mobile bar with high contrast primary/secondary buttons -->
        <div class="actions">
          <button class="btn btn-secondary" type="button" id="resetBtn">Reset</button>
          <button class="btn btn-primary" type="button" id="downloadBtn">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
              <polyline points="7 10 12 15 17 10"></polyline>
              <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Download PDF
          </button>
        </div>
      </form>
    </aside>

    <!-- Right Side: Live Card Preview Panel -->
    <section class="preview-panel">
      <!-- MODIFIED: Preview View Mode Controls (3D All-Direction Drag vs 360 Spin vs Both Cards) -->
      <!-- Reason: Supports 360-degree all-direction trackball rotation using mouse drag & touch swipe -->
      <div class="preview-toolbar">
        <div>
          <h2>Live Preview</h2>
        </div>
        <div class="view-mode-buttons">
          <button class="btn btn-secondary btn-mode active" type="button" id="btnModeFlip">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"></path>
            </svg>
            3D View
          </button>

          <button class="btn btn-secondary btn-mode" type="button" id="btnModeAutoSpin">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M12 8v4l3 3"></path>
            </svg>
            360° Auto Spin
          </button>

          <button class="btn btn-secondary btn-mode" type="button" id="btnModeBoth">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
            Both Cards
          </button>
        </div>
      </div>

      <!-- MODIFIED: Container 1 - 4-Sided Curved 3D Physical PVC ATM/Debit Card -->
      <!-- Reason: Adds top, bottom, left, right 3D edge panels and 4 curved corners for 100% 360-degree realistic card thickness -->
      <div class="single-card-view" id="singleFlipContainer">
        <div class="flip-hint-pill" id="flipHintPill">
          <span>Drag in any direction to rotate 360°</span>
          <span class="badge-side" id="cardSideBadge">FRONT</span>
        </div>

        <div class="flip-card-3d-stage" id="drag3dStage">
          <div class="flip-card-3d-inner" id="flipCardInner">
            <!-- 4-Sided Curved Plastic Core & Edge Panels (Top, Bottom, Left, Right + Corners) -->
            <div class="card-edge-thickness">
              <span class="edge-top"></span>
              <span class="edge-bottom"></span>
              <span class="edge-left"></span>
              <span class="edge-right"></span>
            </div>

            <!-- Front Face -->
            <div class="flip-card-face flip-card-front">
              <div class="scaled-card-wrapper">
                <div class="scaled-card" id="frontPreview3D"></div>
                <div class="card-glare"></div>
              </div>
            </div>
            <!-- Back Face -->
            <div class="flip-card-face flip-card-back">
              <div class="scaled-card-wrapper">
                <div class="scaled-card" id="backPreview3D"></div>
                <div class="card-glare"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- MODIFIED: Container 2 - Side-by-Side Both Cards View -->
      <!-- Reason: Displays Front and Back cards simultaneously for fast dual inspection -->
      <div class="cards side-by-side-view hidden" id="bothCardsContainer">
        <div class="card-shell mode-3d">
          <div class="card-label">
            <span class="dot-indicator"></span> Front Card
          </div>
          <div class="scaled-card-wrapper">
            <div class="scaled-card" id="frontPreview"></div>
            <div class="card-glare"></div>
          </div>
        </div>

        <div class="card-shell mode-3d">
          <div class="card-label">
            <span class="dot-indicator"></span> Back Card
          </div>
          <div class="scaled-card-wrapper">
            <div class="scaled-card" id="backPreview"></div>
            <div class="card-glare"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="print-stack" id="printStack"></div>

  <!-- UNTOUCHED ORIGINAL TEMPLATES FOR FRONT AND BACK ID CARDS -->
  <template id="frontTemplate">
    <div class="id-card front-card">
      <div class="top-bar">
        <div class="logo">
          <div class="agri">Agr<span class="dot">i</span></div>
          <div class="plant-stack"><span class="leaflet one"></span><span class="leaflet two"></span><span class="stack-line s1"></span><span class="stack-line s2"></span><span class="stack-line s3"></span></div>
          <div class="record">record</div>
        </div>
        <div class="title-dev">फार्मर आयडी कार्ड</div>
        <div class="farmer-icon"><div class="body-shirt"></div><div class="farmer-face"></div><div class="turban"></div><div class="mustache"></div></div>
      </div>
      <div class="watermark"></div>
      <div class="photo-box" data-photo-box><div class="photo-placeholder">Upload<br>Photo</div></div>
      <div class="big-leaf"></div>
      <div class="front-details">
        <div class="detail-row name-row"><span class="label-dev">नाव :</span><span class="value" data-field="marathiName"></span><span class="english-name" data-field="englishName"></span></div>
        <div class="detail-row"><span class="label-dev">जन्म दिनांक / DOB :</span><span class="value" data-field="dob"></span></div>
        <div class="detail-row"><span class="label-dev">लिंग / Gender :</span><span class="value" data-field="gender"></span></div>
        <div class="detail-row"><span class="label-dev">मोबाइल / Mobile :</span><span class="value" data-field="mobile"></span></div>
        <div class="detail-row"><span class="label-dev">आधार नं / Aadhaar No :</span><span class="value" data-field="aadhaar"></span></div>
      </div>
      <div class="qr-box" data-qr></div>
      <div class="bottom-bar"><div class="bottom-title">फार्मर आयडी</div><div class="bottom-number" data-field="cardNumber"></div></div>
    </div>
  </template>

  <template id="backTemplate">
    <div class="id-card back-card">
      <div class="back-leaves"><span class="small-leaf a"></span><span class="small-leaf b"></span><span class="small-leaf c"></span></div>
      <div class="back-section">
        <h3 class="back-heading">संपूर्ण पत्ता / Address</h3>
        <p class="address" data-field="address"></p>
        <div class="land-title">जमिनीची माहिती / Land Details</div>
        <div class="land-grid">
          <div class="land-head">जिल्हा</div><div class="land-head">तालुका</div><div class="land-head">गाव</div><div class="land-head">गट नं.</div><div class="land-head">खाते नं.</div><div class="land-head">क्षेत्र हे.आर</div>
          <div data-land-rows></div>
        </div>
      </div>
      <div class="corner-leaf left"><span class="small-leaf a"></span><span class="small-leaf b"></span><span class="small-leaf c"></span></div>
      <div class="corner-leaf right"><span class="small-leaf a"></span><span class="small-leaf b"></span><span class="small-leaf c"></span></div>
      <div class="footer-note">This card is only for personal use not for Govt. identity</div>
    </div>
  </template>

  <script src="script.js"></script>
</body>
</html>
