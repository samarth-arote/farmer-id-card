<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Farmer Card Generator</title>
  <script src="assets/vendor/html2canvas.min.js"></script>
  <script src="assets/vendor/jspdf.umd.min.js"></script>
  <script src="assets/vendor/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f7f4;
      color: #151515;
      font-family: Poppins, Arial, sans-serif;
    }
    button, input, textarea { font: inherit; }
    .app { display: grid; grid-template-columns: minmax(330px, 420px) 1fr; min-height: 100vh; }
    .form-panel { background: #fff; border-right: 1px solid #dfe8e1; padding: 24px; overflow: auto; }
    .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 22px; }
    .brand-mark {
      width: 44px; height: 44px; border-radius: 8px; display: grid; place-items: center;
      background: #236b4f; color: #fff; font-weight: 800; font-size: 20px;
    }
    h1 { margin: 0; color: #236b4f; font-size: 22px; line-height: 1.15; }
    .subtitle { margin: 3px 0 0; color: #65736a; font-size: 13px; }
    .section-title {
      margin: 22px 0 12px; color: #236b4f; font-size: 14px; font-weight: 700; text-transform: uppercase;
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { display: grid; gap: 6px; color: #2c3b33; font-size: 12px; font-weight: 600; }
    input, textarea {
      width: 100%; border: 1px solid #cfdcd4; border-radius: 7px; padding: 10px 11px;
      color: #151515; background: #fff; outline: none; font-size: 14px;
    }
    textarea { resize: vertical; min-height: 74px; }
    input:focus, textarea:focus { border-color: #236b4f; box-shadow: 0 0 0 3px rgba(35, 107, 79, 0.12); }
    .full { grid-column: 1 / -1; }
    .actions {
      display: flex; gap: 10px; margin-top: 22px; position: sticky; bottom: 0;
      padding-top: 16px; background: linear-gradient(rgba(255,255,255,0), #fff 20%);
    }
    .btn { border: 0; border-radius: 7px; padding: 11px 14px; cursor: pointer; font-weight: 700; min-height: 44px; }
    .btn-primary { flex: 1; color: #fff; background: #236b4f; }
    .btn-secondary { color: #236b4f; background: #e9f2ec; }
    .preview-panel { padding: 26px; overflow: auto; }
    .preview-toolbar {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      margin: 0 auto 18px; max-width: 1040px;
    }
    .preview-toolbar h2 { margin: 0; font-size: 18px; color: #236b4f; }
    .preview-note { color: #65736a; font-size: 13px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, 504px); justify-content: center; gap: 24px; }
    .card-shell { display: grid; gap: 10px; }
    .card-label { color: #236b4f; font-size: 13px; font-weight: 700; }
    .scaled-card { width: 504px; height: 325px; position: relative; }
    .id-card {
      width: 1008px; height: 650px; position: relative; overflow: hidden; background: #eef6ef;
      box-shadow: 0 18px 50px rgba(23, 48, 35, 0.12); transform: scale(0.5); transform-origin: top left;
      font-family: Poppins, "Noto Sans Devanagari", Arial, sans-serif;
      background-size: 100% 100%;
      background-repeat: no-repeat;
    }
    .front-card { background-image: url("assets/card-front-reference.png"); }
    .back-card { background-image: url("assets/card-back-reference.png"); }
    .top-bar, .bottom-bar { position: absolute; left: 0; right: 0; background: #236b4f; }
    .top-bar { top: 0; height: 117px; display: none; align-items: center; padding: 0 39px; color: white; }
    .bottom-bar {
      bottom: 0; height: 117px; display: grid; grid-template-columns: 1fr 1.2fr; align-items: center;
      padding: 0 105px 0 108px; gap: 36px; background: transparent;
    }
    .logo { display: flex; align-items: center; gap: 14px; font-weight: 700; line-height: 1; white-space: nowrap; }
    .agri { font-size: 74px; }
    .agri .dot, .record { color: #ffd324; }
    .record { font-size: 55px; font-weight: 600; }
    .plant-stack { width: 45px; height: 84px; position: relative; flex: 0 0 auto; }
    .leaflet { position: absolute; width: 24px; height: 38px; background: #a7d719; border-radius: 0 22px 0 22px; transform: rotate(43deg); }
    .leaflet.one { left: 8px; top: 2px; background: #b7df14; }
    .leaflet.two { left: 24px; top: 12px; background: #9dd420; transform: rotate(43deg) scaleX(-1); }
    .stack-line { position: absolute; left: 3px; width: 38px; height: 11px; background: #9bd51c; clip-path: polygon(50% 0, 100% 45%, 50% 100%, 0 45%); }
    .stack-line.s1 { top: 43px; } .stack-line.s2 { top: 56px; } .stack-line.s3 { top: 69px; }
    .title-dev { position: relative; top: 10px; margin-left: 24px; margin-right: 140px; font-size: 50px; font-weight: 800; line-height: 1; white-space: nowrap; }
    .farmer-icon { position: absolute; right: 34px; top: 17px; width: 112px; height: 100px; }
    .farmer-face { position: absolute; left: 35px; top: 23px; width: 44px; height: 48px; background: #ffd9ac; border: 3px solid #101010; border-radius: 50%; }
    .turban { position: absolute; left: 21px; top: 0; width: 72px; height: 43px; background: repeating-linear-gradient(28deg, #ff7c00 0 9px, #111 9px 12px); border: 3px solid #111; border-radius: 46% 54% 18% 18%; transform: rotate(10deg); }
    .body-shirt { position: absolute; left: 14px; bottom: -8px; width: 86px; height: 48px; background: #fff; border: 3px solid #111; border-bottom: 0; border-radius: 38px 38px 0 0; }
    .mustache { position: absolute; left: 42px; top: 52px; width: 31px; height: 10px; background: #111; border-radius: 50%; z-index: 2; }
    .photo-box { position: absolute; left: 36px; top: 146px; width: 179px; height: 188px; border: 4px solid #236b4f; border-radius: 13px; overflow: hidden; background: #fff; z-index: 3; }
    .photo-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .photo-placeholder { width: 100%; height: 100%; display: grid; place-items: center; color: #6f7f75; background: #dde7df; font-size: 18px; font-weight: 700; text-align: center; padding: 18px; }
    .big-leaf { position: absolute; left: 54px; top: 369px; width: 164px; height: 114px; background: #236b4f; border-radius: 90% 0 90% 8%; transform: skewX(-18deg) rotate(-10deg); display: none; }
    .big-leaf::after { content: ""; position: absolute; left: 51px; top: 25px; width: 128px; height: 22px; border-top: 9px solid #fff; border-radius: 90% 0 0 0; transform: rotate(-20deg); }
    .watermark { position: absolute; left: 288px; top: 128px; width: 528px; height: 362px; opacity: 0.07; pointer-events: none; display: none; }
    .watermark::before { content: ""; position: absolute; left: 20px; top: 124px; width: 160px; height: 104px; border: 8px solid #236b4f; border-radius: 50%; }
    .watermark::after { content: ""; position: absolute; right: 42px; top: 28px; width: 238px; height: 250px; border: 8px solid #236b4f; border-left-color: transparent; border-bottom-color: transparent; border-radius: 50%; transform: rotate(-32deg); }
    .front-details { position: absolute; inset: 0; display: block; font-size: 29px; line-height: 1.13; z-index: 4; pointer-events: none; }
    .detail-row { display: contents; white-space: nowrap; }
    .label-dev { display: none; }
    .value,
    .name-row .english-name {
      position: absolute;
      color: #151515;
      font-weight: 500;
      background: #eef6ef;
      padding: 0 8px;
      line-height: 1.18;
      white-space: nowrap;
    }
    [data-field="marathiName"] { left: 365px; top: 181px; min-width: 380px; font-size: 27px; }
    .name-row .english-name { left: 364px; top: 222px; min-width: 390px; font-size: 27px; margin: 0; display: block; }
    [data-field="dob"] { left: 500px; top: 277px; min-width: 225px; }
    [data-field="gender"] { left: 499px; top: 346px; min-width: 190px; }
    [data-field="mobile"] { left: 531px; top: 411px; min-width: 280px; }
    [data-field="aadhaar"] { left: 598px; top: 478px; min-width: 350px; }
    .qr-box { position: absolute; right: 37px; top: 278px; width: 174px; height: 174px; background: #fff; padding: 8px; display: grid; place-items: center; z-index: 3; }
    .qr-box img, .qr-box canvas { width: 158px !important; height: 158px !important; }
    .bottom-title { color: #fff200; font-size: 61px; font-weight: 800; white-space: nowrap; visibility: hidden; }
    .bottom-number { color: #fff; font-size: 56px; font-weight: 800; white-space: nowrap; position: relative; z-index: 4; }
    .bottom-number::before {
      content: "";
      position: absolute;
      inset: -8px -18px -7px -16px;
      background: #236b4f;
      z-index: -1;
    }
    .back-card { border: 4px solid #c4f0cf; background-color: #eef6ef; padding: 0; }
    .back-leaves { position: absolute; right: 36px; top: 43px; width: 232px; height: 119px; opacity: 0.95; display: none; }
    .small-leaf { position: absolute; width: 118px; height: 62px; background: #236b4f; border-radius: 90% 0 90% 0; transform: rotate(-13deg); }
    .small-leaf::after { content: ""; position: absolute; left: 42px; top: 14px; width: 73px; height: 16px; border-top: 5px solid #fff; border-radius: 100% 0 0 0; opacity: 0.75; transform: rotate(-17deg); }
    .small-leaf.a { right: 0; top: 0; } .small-leaf.b { right: 110px; top: 14px; opacity: 0.16; } .small-leaf.c { right: 83px; top: 73px; transform: rotate(-13deg) scale(0.68); opacity: 0.17; }
    .back-section { position: absolute; inset: 0; z-index: 4; pointer-events: none; }
    .back-heading { margin: 0 0 12px; color: #17622c; font-size: 31px; font-weight: 800; line-height: 1.2; visibility: hidden; }
    .address { position: absolute; left: 78px; top: 111px; margin: 0; max-width: 760px; font-size: 24px; line-height: 1.4; font-weight: 600; width: fit-content; background: #eef6ef; padding: 0 10px; }
    .address::before {
      content: none;
    }
    .land-title { margin-bottom: 28px; font-size: 31px; color: #17622c; font-weight: 800; visibility: hidden; }
    .land-grid { position: absolute; left: 78px; right: 75px; top: 251px; display: grid; grid-template-columns: 1.05fr 0.95fr 1.2fr 0.9fr 0.9fr 1.1fr; gap: 20px; align-items: start; }
    .land-head { color: #17622c; font-size: 25px; font-weight: 800; visibility: hidden; }
    .land-cell { margin-top: 28px; color: #1e1e1e; font-size: 21px; font-weight: 500; position: relative; width: fit-content; background: #eef6ef; padding: 0 8px; }
    .land-cell::before {
      content: "";
      position: absolute;
      inset: -4px -10px -4px -6px;
      background: #eef6ef;
      z-index: -1;
    }
    .footer-note { position: absolute; left: 126px; right: 126px; bottom: 13px; display: none; align-items: center; gap: 18px; color: #236b4f; font-size: 23px; font-weight: 700; text-align: center; }
    .footer-note::before, .footer-note::after { content: ""; height: 2px; background: #236b4f; flex: 1; }
    .corner-leaf { position: absolute; bottom: 12px; width: 85px; height: 47px; opacity: 0.95; display: none; }
    .corner-leaf.left { left: 42px; } .corner-leaf.right { right: 42px; transform: scaleX(-1); }
    .corner-leaf .small-leaf { width: 51px; height: 27px; }
    .corner-leaf .small-leaf.b { right: 38px; top: 10px; opacity: 0.18; }
    .corner-leaf .small-leaf.c { right: 23px; top: 29px; opacity: 0.18; }
    .print-stack { position: fixed; left: -9999px; top: 0; width: 1008px; }
    .print-stack .id-card { transform: none; box-shadow: none; margin-bottom: 20px; }
    @media (max-width: 1120px) {
      .app { grid-template-columns: 1fr; }
      .form-panel { border-right: 0; border-bottom: 1px solid #dfe8e1; }
      .cards { grid-template-columns: minmax(320px, 504px); }
    }
    @media (max-width: 560px) {
      .form-panel, .preview-panel { padding: 18px; }
      .grid { grid-template-columns: 1fr; }
      .preview-toolbar { display: grid; }
      .scaled-card { width: min(100%, 504px); height: auto; aspect-ratio: 1008 / 650; }
      .id-card { transform: scale(calc((100vw - 36px) / 1008)); }

      /* Mobile-only: tighten front text layout so values (Aadhaar/Mobile/etc.) look compact like mobile preview. */
      .front-card [data-field="marathiName"] { min-width: 230px; font-size: 24px; }
      .front-card .name-row .english-name { min-width: 240px; font-size: 24px; }

      .front-card [data-field="dob"] { min-width: 132px; font-size: 22px; }
      .front-card [data-field="gender"] { min-width: 110px; font-size: 22px; }

      .front-card [data-field="mobile"] { min-width: 205px; font-size: 22px; }
      .front-card [data-field="aadhaar"] { min-width: 265px; font-size: 20.5px; }

      /* Reduce label/value visual padding effects on tight layouts (still no wrapping). */
      .front-card .value {
        padding: 0 6px;
      }
      .front-card .detail-row { white-space: nowrap; }
    }

    /* Clean Canva-layer reconstruction. No finished-card screenshot is used underneath. */
    .front-card {
      background-image: none;
      background-color: #eef6ef;
    }
    .front-card .top-bar {
      display: flex;
      height: 125px;
      background: #236b4f;
    }
    .front-card .bottom-bar {
      height: 125px;
      bottom: 0;
      background: #236b4f;
    }
    .front-card .plant-stack {
      background: url("assets/canva-layers/front-plant.png") center / contain no-repeat;
      width: 52px;
      height: 88px;
    }
    .front-card .plant-stack * { display: none; }
    .front-card .farmer-icon {
      right: 37px;
      top: 12px;
      width: 102px;
      height: 113px;
      background: url("assets/canva-layers/front-farmer.png") center / contain no-repeat;
    }
    .front-card .farmer-icon * { display: none; }
    .front-card .watermark {
      display: block;
      left: 252px;
      top: 112px;
      width: 708px;
      height: 413px;
      opacity: 1;
      background: url("assets/canva-layers/front-watermark.png") center / contain no-repeat;
    }
    .front-card .watermark::before,
    .front-card .watermark::after { content: none; }
    .front-card .big-leaf {
      display: block;
      left: 50px;
      top: 361px;
      width: 178px;
      height: 126px;
      background: url("assets/canva-layers/front-leaf.png") center / contain no-repeat;
      border-radius: 0;
      transform: none;
    }
    .front-card .big-leaf::after { content: none; }
    .front-card .photo-box {
      left: 25px;
      top: 137px;
      width: 203px;
      height: 200px;
      border-radius: 13px;
    }
    .front-card .qr-box {
      left: 795px;
      top: 274px;
      width: 190px;
      height: 188px;
    }
    .front-card [data-field="marathiName"] { left: 36.4%; top: 178px; min-width: 270px; }
    .front-card .name-row .english-name { left: 36.4%; top: 219px; min-width: 300px; }
    .front-card [data-field="dob"] { left: 55.5%; top: 276px; min-width: 155px; }
    .front-card [data-field="gender"] { left: 50.6%; top: 343px; min-width: 80px; }
    .front-card [data-field="mobile"] { left: 54.4%; top: 405px; min-width: 180px; }
    .front-card [data-field="aadhaar"] { left: 63.5%; top: 472px; min-width: 220px; }
    .front-card .value,
    .front-card .name-row .english-name {
      background: transparent;
      padding: 0;
    }
    .front-card .label-dev {
      display: block;
      position: absolute;
      color: #17622c;
      font-weight: 800;
      white-space: nowrap;
    }
    .front-card .detail-row:nth-child(1) .label-dev { left: 287.85px; top: 178.84px; }
    .front-card .detail-row:nth-child(2) .label-dev { left: 287.85px; top: 276.9px; }
    .front-card .detail-row:nth-child(3) .label-dev { left: 287.85px; top: 343.7px; }
    .front-card .detail-row:nth-child(4) .label-dev { left: 287.85px; top: 406px; }
    .front-card .detail-row:nth-child(5) .label-dev { left: 287.85px; top: 472.9px; }
    .front-card .bottom-title {
      visibility: visible;
    }
    .front-card .bottom-number::before {
      content: none;
    }

    .back-card {
      background-image: none;
      background-color: #eef6ef;
      border: 4px solid #c4f0cf;
    }
    .back-card .back-leaves {
      display: block;
      left: 732px;
      top: 37px;
      width: 242px;
      height: 127px;
      background: url("assets/canva-layers/back-leaves.png") center / contain no-repeat;
    }
    .back-card .back-leaves * { display: none; }
    .back-card .back-heading,
    .back-card .land-title,
    .back-card .land-head,
    .back-card .footer-note {
      visibility: visible;
      display: block;
    }
    .back-card .back-heading {
      position: absolute;
      left: 80.88px;
      top: 59.42px;
      margin: 0;
    }
    .back-card .address {
      left: 80.88px;
      top: 111.22px;
      min-width: 0;
      background: transparent;
      padding: 0;
    }
    .back-card .land-title {
      position: absolute;
      left: 80.88px;
      top: 199.66px;
      margin: 0;
    }
    .back-card .land-grid {
      left: 80.88px;
      top: 258.8px;
      right: auto;
      width: 831px;
      grid-template-columns: 123.56px 125.58px 123.56px 125.58px 125.58px 123.56px;
      gap: 20px;
    }
    .back-card .land-cell {
      margin-top: 15px;
      min-width: 0;
      background: transparent;
      padding: 0;
    }
    .back-card .footer-note {
      left: 188.05px;
      right: auto;
      bottom: auto;
      top: 608.81px;
      width: 620px;
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="form-panel">
      <div class="brand">
        <div class="brand-mark">ID</div>
        <div>
          <h1>Farmer Card Generator</h1>
          <p class="subtitle">Fill the form, preview the card, download PDF.</p>
        </div>
      </div>
      <form id="cardForm">
        <div class="section-title">Personal Details</div>
        <div class="grid">
          <label>Marathi Name <input name="marathiName" value="नाव"></label>
          <label>English Name <input name="englishName" value="Name"></label>
          <label>DOB <input name="dob" value="01-01-1973"></label>
          <label>Gender <input name="gender" value="Male"></label>
          <label>Mobile <input name="mobile" value="8888160485"></label>
          <label>Aadhaar No <input name="aadhaar" value="9224 4188 1974"></label>
          <label>Card Number <input name="cardNumber" value="354 62 90 04 99"></label>
          <label>Photo <input name="photo" type="file" accept="image/*"></label>
        </div>
        <div class="section-title">Address</div>
        <div class="grid">
          <label class="full">Complete Address <textarea name="address">vagadara wadi Bramhanwada tal akole dist ahilyanagar</textarea></label>
        </div>
        <div class="section-title">Land Details</div>
        <div class="grid">
          <label>District <input name="district" value="अहिल्यानगर"></label>
          <label>Taluka <input name="taluka" value="अकोले"></label>
          <label>Village <input name="village" value="ब्राह्मणवाडा"></label>
          <label>Gat No. <input name="gatNo" value="307/2"></label>
          <label>Khate No. <input name="khateNo" value="462"></label>
          <label>Area H.R. <input name="area" value="0.4550"></label>
        </div>
        <div class="actions">
          <button class="btn btn-secondary" type="button" id="resetBtn">Reset</button>
          <button class="btn btn-primary" type="button" id="downloadBtn">Download PDF</button>
        </div>
      </form>
    </aside>
    <section class="preview-panel">
      <div class="preview-toolbar">
        <h2>Live Preview</h2>
        <div class="preview-note">PDF includes front and back on separate pages.</div>
      </div>
      <div class="cards">
        <div class="card-shell"><div class="card-label">Front</div><div class="scaled-card" id="frontPreview"></div></div>
        <div class="card-shell"><div class="card-label">Back</div><div class="scaled-card" id="backPreview"></div></div>
      </div>
    </section>
  </main>
  <div class="print-stack" id="printStack"></div>
  <template id="frontTemplate">
    <div class="id-card front-card">
      <div class="top-bar">
        <div class="logo">
          <div class="agri">Agr<span class="dot">i</span></div>
          <div class="plant-stack"><span class="leaflet one"></span><span class="leaflet two"></span><span class="stack-line s1"></span><span class="stack-line s2"></span><span class="stack-line s3"></span></div>
          <div class="record">record</div>
        </div>
        <div class="title-dev">फार्मर आयडी कार्ड</div>
        <div class="farmer-icon"><div class="body-shirt"></div><div class="farmer-face"></div><div class="turban"></div><div class="mustache"></div></div>
      </div>
      <div class="watermark"></div>
      <div class="photo-box" data-photo-box><div class="photo-placeholder">Upload<br>Photo</div></div>
      <div class="big-leaf"></div>
      <div class="front-details">
        <div class="detail-row name-row"><span class="label-dev">नाव :</span><span class="value" data-field="marathiName"></span><span class="english-name" data-field="englishName"></span></div>
        <div class="detail-row"><span class="label-dev">जन्म दिनांक / DOB :</span><span class="value" data-field="dob"></span></div>
        <div class="detail-row"><span class="label-dev">लिंग / Gender :</span><span class="value" data-field="gender"></span></div>
        <div class="detail-row"><span class="label-dev">मोबाइल / Mobile :</span><span class="value" data-field="mobile"></span></div>
        <div class="detail-row"><span class="label-dev">आधार नं / Aadhaar No :</span><span class="value" data-field="aadhaar"></span></div>
      </div>
      <div class="qr-box" data-qr></div>
      <div class="bottom-bar"><div class="bottom-title">फार्मर आयडी</div><div class="bottom-number" data-field="cardNumber"></div></div>
    </div>
  </template>
  <template id="backTemplate">
    <div class="id-card back-card">
      <div class="back-leaves"><span class="small-leaf a"></span><span class="small-leaf b"></span><span class="small-leaf c"></span></div>
      <div class="back-section">
        <h3 class="back-heading">संपूर्ण पत्ता / Address</h3>
        <p class="address" data-field="address"></p>
        <div class="land-title">जमिनीची माहिती / Land Details</div>
        <div class="land-grid">
          <div class="land-head">जिल्हा</div><div class="land-head">तालुका</div><div class="land-head">गाव</div><div class="land-head">गट नं.</div><div class="land-head">खाते नं.</div><div class="land-head">क्षेत्र हे.आर</div>
          <div class="land-cell" data-field="district"></div><div class="land-cell" data-field="taluka"></div><div class="land-cell" data-field="village"></div><div class="land-cell" data-field="gatNo"></div><div class="land-cell" data-field="khateNo"></div><div class="land-cell" data-field="area"></div>
        </div>
      </div>
      <div class="corner-leaf left"><span class="small-leaf a"></span><span class="small-leaf b"></span><span class="small-leaf c"></span></div>
      <div class="corner-leaf right"><span class="small-leaf a"></span><span class="small-leaf b"></span><span class="small-leaf c"></span></div>
      <div class="footer-note">This card is only for personal use not for Govt. identity</div>
    </div>
  </template>
  <script>
    const form = document.getElementById("cardForm");
    const frontPreview = document.getElementById("frontPreview");
    const backPreview = document.getElementById("backPreview");
    const printStack = document.getElementById("printStack");
    const frontTemplate = document.getElementById("frontTemplate");
    const backTemplate = document.getElementById("backTemplate");
    const downloadBtn = document.getElementById("downloadBtn");
    const resetBtn = document.getElementById("resetBtn");
    let photoDataUrl = "";

    function formData() {
      const data = Object.fromEntries(new FormData(form).entries());
      delete data.photo;
      return data;
    }

    function qrPayload(data) {
      return [`Name: ${data.englishName}`, `DOB: ${data.dob}`, `Gender: ${data.gender}`, `Mobile: ${data.mobile}`, `Aadhaar: ${data.aadhaar}`, `Card: ${data.cardNumber}`, `Address: ${data.address}`].join("\n");
    }

    function makeCard(template, data) {
      const node = template.content.firstElementChild.cloneNode(true);
      node.querySelectorAll("[data-field]").forEach((element) => { element.textContent = data[element.dataset.field] || ""; });
      const photoBox = node.querySelector("[data-photo-box]");
      if (photoBox && photoDataUrl) photoBox.innerHTML = `<img alt="Farmer photo" src="${photoDataUrl}">`;
      const qr = node.querySelector("[data-qr]");
      if (qr) {
        qr.innerHTML = "";
        if (window.QRCode) {
          new QRCode(qr, { text: qrPayload(data), width: 158, height: 158, correctLevel: QRCode.CorrectLevel.M });
        } else {
          qr.innerHTML = '<div style="font-size:11px;line-height:1.2;text-align:center;color:#111">QR library<br>not loaded</div>';
        }
      }
      return node;
    }

    function render() {
      const data = formData();
      frontPreview.innerHTML = "";
      backPreview.innerHTML = "";
      frontPreview.appendChild(makeCard(frontTemplate, data));
      backPreview.appendChild(makeCard(backTemplate, data));
    }

    function loadPhoto(file) {
      if (!file) { photoDataUrl = ""; render(); return; }
      const reader = new FileReader();
      reader.onload = () => { photoDataUrl = reader.result; render(); };
      reader.readAsDataURL(file);
    }

    async function cardCanvas(card) {
      return html2canvas(card, { scale: 2, backgroundColor: null, useCORS: true, logging: false });
    }

    async function downloadPdf() {
      if (!window.html2canvas || !window.jspdf) {
        alert("PDF libraries are not loaded. Please connect to the internet and refresh this page once, then try Download PDF again.");
        return;
      }
      downloadBtn.disabled = true;
      downloadBtn.textContent = "Creating PDF...";
      const data = formData();
      printStack.innerHTML = "";
      const front = makeCard(frontTemplate, data);
      const back = makeCard(backTemplate, data);
      printStack.append(front, back);
      await new Promise((resolve) => setTimeout(resolve, 250));
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: "landscape", unit: "px", format: [1008, 650] });
      const frontCanvas = await cardCanvas(front);
      const backCanvas = await cardCanvas(back);
      pdf.addImage(frontCanvas.toDataURL("image/png"), "PNG", 0, 0, 1008, 650);
      pdf.addPage([1008, 650], "landscape");
      pdf.addImage(backCanvas.toDataURL("image/png"), "PNG", 0, 0, 1008, 650);
      const name = (data.englishName || "Farmer").trim().replace(/[^a-z0-9]+/gi, "-").replace(/^-|-$/g, "").toLowerCase();
      pdf.save(`${name || "Farmer"}-card.pdf`);
      printStack.innerHTML = "";
      downloadBtn.disabled = false;
      downloadBtn.textContent = "Download PDF";
    }

    form.addEventListener("input", (event) => { if (event.target.name !== "photo") render(); });
    form.photo.addEventListener("change", (event) => { loadPhoto(event.target.files[0]); });
    resetBtn.addEventListener("click", () => { form.reset(); photoDataUrl = ""; render(); });
    downloadBtn.addEventListener("click", downloadPdf);
    render();
  </script>
</body>
</html>
